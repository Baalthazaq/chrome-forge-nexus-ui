<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Classic Breakout - Shield</title>
    <style>
        body {
            background-color: #04050a; color: #fff; font-family: 'Courier New', Courier, monospace;
            margin: 0; padding: 20px; display: flex; flex-direction: column;
            align-items: center; overflow-x: hidden; width: 100%; min-height: 100vh; box-sizing: border-box;
            background-image: radial-gradient(ellipse at 50% 0%, rgba(0, 229, 255, 0.08), transparent 60%);
        }
        h1 {
            margin: 5px 0 10px 0; font-size: 28px; text-transform: uppercase; letter-spacing: 4px; color: #00e5ff;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.7), 0 0 40px rgba(0, 229, 255, 0.3);
        }
        #hud {
            width: 100%; max-width: 840px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(4, 5, 10, 0.9); border: 2px solid rgba(0, 229, 255, 0.4); border-bottom: none;
            padding: 10px 20px; font-weight: bold; border-radius: 8px 8px 0 0; box-sizing: border-box;
            font-size: 18px;
        }
        #scoreDisplay { color: #ff3333; }
        #messageLog { color: #00ff00; text-align: right; min-width: 200px; }

        .diff-select {
            background: #333; color: #fff; border: 2px solid #555; padding: 4px 8px;
            font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 16px;
            border-radius: 4px; cursor: pointer; outline: none;
        }

        canvas#gameCanvas {
            border: 2px solid rgba(0, 229, 255, 0.4); width: 100%; max-width: 840px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.12), 0 10px 30px rgba(0, 0, 0, 0.8); image-rendering: pixelated; background: #000;
        }
        #crt {
            position: fixed; inset: 0; pointer-events: none; z-index: 100;
            background:
                radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.4) 100%),
                repeating-linear-gradient(to bottom, rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px, transparent 1px, transparent 3px);
        }
        #backLink {
            position: fixed; top: 14px; left: 14px; z-index: 101; color: #00e5ff; text-decoration: none;
            border: 2px solid rgba(0, 229, 255, 0.5); padding: 6px 12px; font-weight: bold; font-size: 14px;
            border-radius: 4px; background: rgba(0,0,0,0.6); letter-spacing: 1px;
        }
        #backLink:hover { background: #00e5ff; color: #000; box-shadow: 0 0 15px rgba(0, 229, 255, 0.8); }
    </style>
</head>
<body>

    <div id="crt"></div>
    <a id="backLink" href="Character select.html">&#9668; CONSTRUCT</a>
    <h1>ARCADE CLASSIC: BREAKOUT</h1>
    <div id="hud">
        <span id="scoreDisplay">SCORE: 0 | DEATHS: 0</span>
        <span>
            <select id="difficultySelect" class="diff-select" onchange="changeDifficulty()">
                <option value="0.7">EASY (0.7x)</option>
                <option value="1.0" selected>NORMAL (1.0x)</option>
                <option value="1.5">HARDCORE (1.5x)</option>
            </select>
        </span>
        <span id="messageLog">PRESS SPACE TO LAUNCH</span>
    </div>
    <canvas id="gameCanvas" width="840" height="600"></canvas>

    <script>
        const REWARD_MESSAGE = ">>> WINNER <<<\n\nThe firewall is down.\nProceed to the next sector.";
        
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // --- AUDIO (layered 8-bit synth) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.6;
        masterGain.connect(audioCtx.destination);

        let noiseBuf = null;
        function getNoise() {
            if (!noiseBuf) {
                noiseBuf = audioCtx.createBuffer(1, audioCtx.sampleRate, audioCtx.sampleRate);
                const d = noiseBuf.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            }
            return noiseBuf;
        }

        function tone(o) {
            const now = audioCtx.currentTime + (o.delay || 0);
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = o.type || 'square';
            osc.frequency.setValueAtTime(o.f0, now);
            if (o.f1) {
                if (o.curve === 'lin') osc.frequency.linearRampToValueAtTime(o.f1, now + o.t);
                else osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), now + o.t);
            }
            g.gain.setValueAtTime(o.vol || 0.1, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + o.t);
            osc.connect(g); g.connect(masterGain);
            osc.start(now); osc.stop(now + o.t + 0.05);
        }

        function noiseHit(o) {
            const now = audioCtx.currentTime + (o.delay || 0);
            const src = audioCtx.createBufferSource(); src.buffer = getNoise(); src.loop = true;
            const filt = audioCtx.createBiquadFilter();
            filt.type = o.type || 'lowpass';
            filt.frequency.setValueAtTime(o.f || 1000, now);
            if (o.f1) filt.frequency.exponentialRampToValueAtTime(Math.max(20, o.f1), now + o.t);
            filt.Q.value = o.q || 1;
            const g = audioCtx.createGain();
            g.gain.setValueAtTime(o.vol || 0.2, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + o.t);
            src.connect(filt); filt.connect(g); g.connect(masterGain);
            src.start(now); src.stop(now + o.t + 0.05);
        }

        function playSound(type, arg) {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (type === 'bounce') {
                let f = 380 + Math.random() * 60;
                tone({ type: 'square', f0: f, f1: f * 0.8, t: 0.08, vol: 0.08 });
                tone({ type: 'sine', f0: f * 2, t: 0.05, vol: 0.04 });
            } else if (type === 'break') {
                // Pitch rises with brick row: top rows ring higher (arg = brick y)
                let f = 500 + Math.max(0, (280 - (arg || 180))) * 3;
                tone({ type: 'square', f0: f, f1: f * 1.4, t: 0.09, vol: 0.1 });
                noiseHit({ type: 'highpass', f: 2000, t: 0.12, vol: 0.1 });
                tone({ type: 'triangle', f0: f * 0.5, f1: f * 0.4, t: 0.12, vol: 0.06 });
            } else if (type === 'metal') {
                // Armored clank: detuned pair + ring
                tone({ type: 'square', f0: 220, f1: 140, t: 0.12, vol: 0.12 });
                tone({ type: 'square', f0: 227, f1: 145, t: 0.12, vol: 0.1 });
                tone({ type: 'sine', f0: 1180, f1: 900, t: 0.2, vol: 0.05 });
                noiseHit({ type: 'bandpass', f: 3200, q: 5, t: 0.1, vol: 0.1 });
            } else if (type === 'die') {
                noiseHit({ f: 2200, f1: 100, t: 0.5, vol: 0.3 });
                tone({ type: 'sawtooth', f0: 140, f1: 30, t: 0.5, vol: 0.2 });
                tone({ type: 'square', f0: 70, f1: 25, t: 0.6, vol: 0.13 });
            } else if (type === 'win') {
                [440, 554.37, 659.25, 880, 1108.73, 1318.51].forEach((f, i) =>
                    tone({ type: 'square', f0: f, t: 0.28, vol: 0.09, delay: i * 0.09 }));
                [220, 277.18, 329.63, 440, 554.37, 659.25].forEach((f, i) =>
                    tone({ type: 'triangle', f0: f, t: 0.38, vol: 0.05, delay: i * 0.09 }));
            }
        }

        // --- LOAD SHIELD SPRITE ---
        const playerSprite = new Image();
        playerSprite.src = 'Shield.png';

        let score = 0, deaths = 0, diffMult = 1.0, isGameActive = true;
        let spawnX = 400, spawnY = 500, baseBallSpeed = 6;
        let globalTime = 0, shakeTimer = 0;
        let ballTrail = [];
        let particles = [];

        function spawnBurst(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x, y: y,
                    dx: (Math.random() - 0.5) * 8, dy: (Math.random() - 0.5) * 8,
                    life: 15 + Math.random() * 15, color: color
                });
            }
        }
        
        let player = { x: spawnX, y: spawnY, width: 40, height: 40, speed: 12, frameX: 0, frameY: 3, animTimer: 0 };
        let ball = { x: spawnX + 20, y: spawnY - 35, radius: 8, dx: 0, dy: 0, attached: true };

        const keys = { w: false, a: false, s: false, d: false, space: false };
        window.addEventListener("keydown", (e) => {
            let k = e.key.toLowerCase();
            if (k === ' ') keys.space = true; else if (keys.hasOwnProperty(k)) keys[k] = true;
            if (!isGameActive && (e.code === 'Space' || e.code === 'Enter')) restartGame();
            if(audioCtx.state === 'suspended') audioCtx.resume();
        });
        window.addEventListener("keyup", (e) => { 
            let k = e.key.toLowerCase(); 
            if (k === ' ') keys.space = false; else if (keys.hasOwnProperty(k)) keys[k] = false; 
        });

        // --- GAMEPAD CONTROLLER SUPPORT ---
        let gpStartWasPressed = false;
        function pollGamepad() {
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            const gp = gamepads[0];

            if (gp) {
                keys.w = gp.buttons[12]?.pressed || gp.axes[1] < -0.3;
                keys.s = gp.buttons[13]?.pressed || gp.axes[1] >  0.3;
                keys.a = gp.buttons[14]?.pressed || gp.axes[0] < -0.3;
                keys.d = gp.buttons[15]?.pressed || gp.axes[0] >  0.3;

                // Map 'A' Button to Space (for ball launch)
                keys.space = gp.buttons[0]?.pressed;

                // 'A' or Start restarts after the run ends (edge-triggered)
                let startPressed = gp.buttons[0]?.pressed || gp.buttons[9]?.pressed;
                if (startPressed && !gpStartWasPressed && !isGameActive) {
                    restartGame();
                }
                gpStartWasPressed = startPressed;
            }
        }

        // --- DYNAMIC LAYER GENERATION (5 Layers) ---
        let blocks = [];
        let bricksRemaining = 0;

        const baseUnits = [1, 1, 1, 1, 2, 2, 2, 3, 3, 4]; // 10 blocks, 20 units total per row
        const unitWidth = 38; // 20 units * 38px = 760px playable width
        const rowColors = ["#9c27b0", "#ff3333", "#ff9800", "#4caf50", "#00bcd4"];

        function initBlocks() {
        blocks = [];
        bricksRemaining = 0;
        let matrixLayers = [];
        for(let r=0; r<5; r++) {
            let shuffled = [...baseUnits].sort(() => Math.random() - 0.5);
            matrixLayers.push(shuffled.map(u => ({ size: u, deleted: false, isSpecial: false })));
        }

        // Steal exactly 1 full set (1x4, 2x3, 3x2, 4x1) from the bottom 4 layers to create gaps
        const toSteal = [4, 3, 3, 2, 2, 2, 1, 1, 1, 1];
        for(let stealSize of toSteal) {
            let candidates = [];
            for(let r=1; r<5; r++) { // Only steal from layers 1-4
                for(let c=0; c<10; c++) {
                    if(matrixLayers[r][c].size === stealSize && !matrixLayers[r][c].deleted) {
                        candidates.push({r, c});
                    }
                }
            }
            if(candidates.length > 0) {
                let pick = candidates[Math.floor(Math.random() * candidates.length)];
                matrixLayers[pick.r][pick.c].deleted = true;
            }
        }

        // Assign the Metallic Armored Blocks
        for(let r=0; r<5; r++) {
            if (r === 0) {
                // Top layer MUST block the escape gap (Midpoint: 420)
                let tempX = 40;
                for(let c=0; c<10; c++) {
                    let nextX = tempX + (matrixLayers[0][c].size * unitWidth);
                    if (tempX <= 420 && nextX >= 420) {
                        matrixLayers[0][c].isSpecial = true;
                        break;
                    }
                    tempX = nextX;
                }
            } else {
                let active = [];
                for(let c=0; c<10; c++) if(!matrixLayers[r][c].deleted) active.push(c);
                if(active.length > 0) {
                    let pick = active[Math.floor(Math.random() * active.length)];
                    matrixLayers[r][pick].isSpecial = true;
                }
            }
        }

        // Finalize Block Array
        for(let r=0; r<5; r++) {
            let currentX = 40; 
            for(let c=0; c<10; c++) {
                let item = matrixLayers[r][c];
                let w = item.size * unitWidth;
                
                if (!item.deleted) {
                    let baseHp = item.size; 
                    let layerBonus = (5 - r); // +5 for Top, +1 for Bottom
                    let hp = item.isSpecial ? (baseHp + layerBonus) : baseHp;
                    
                    blocks.push({
                        x: currentX, 
                        y: 80 + (r * 40), 
                        w: w, 
                        h: 40, 
                        health: hp, 
                        maxHealth: hp,
                        isSpecial: item.isSpecial,
                        color: rowColors[r]
                    });
                    bricksRemaining++;
                }
                currentX += w;
            }
        }
        }
        initBlocks();

        let launchLock = false;
        function restartGame() {
            initBlocks();
            score = 0; deaths = 0;
            updateScoreboard();
            resetBall(true);
            particles = [];
            isGameActive = true;
            launchLock = true;
            showMessage("FIREWALL REBUILT...", "#00ffff");
        }

        function updateScoreboard() { document.getElementById('scoreDisplay').innerText = `SCORE: ${score} | DEATHS: ${deaths}`; }
        function showMessage(text, color = "#ffeb3b") { let msg = document.getElementById('messageLog'); msg.innerText = text; msg.style.color = color; setTimeout(() => { msg.innerText = ""; }, 2000); }
        function changeDifficulty() { diffMult = parseFloat(document.getElementById('difficultySelect').value); resetBall(true); showMessage("DIFFICULTY UPDATED", "#ffeb3b"); }

        function resetBall(silent = false) {
            ball.attached = true; ball.dx = 0; ball.dy = 0;
            ballTrail = [];
            player.x = spawnX; player.y = spawnY;
            if(!silent) {
                deaths++; updateScoreboard(); playSound('die'); showMessage("SYSTEM CRASH", "#ff3333");
                shakeTimer = 18;
                spawnBurst(ball.x, canvas.height - 10, "#00ffff", 20);
            }
        }

        function hitWall(newX, newY) {
            // Borders
            if (newX < 40 || newX + player.width > canvas.width - 40) return true;
            if (newY > canvas.height - player.height) return true;
            
            // Top Escape Gap (x: 382 to 458)
            if (newY < 40) {
                if (newX >= 382 && newX + player.width <= 458) {
                    if (newY < 0 && isGameActive) {
                        isGameActive = false;
                        playSound('win');
                    }
                    return false; // Free to pass through the gap
                }
                return true; 
            }

            // Solid Block Collision for Player
            for (let b of blocks) {
                if (b.health > 0) {
                    if (newX < b.x + b.w && newX + player.width > b.x && newY < b.y + b.h && newY + player.height > b.y) {
                        return true;
                    }
                }
            }
            return false;
        }

        function update() {
            pollGamepad(); // Evaluate gamepad input
            globalTime++;

            for (let i = particles.length - 1; i >= 0; i--) {
                let pt = particles[i];
                pt.x += pt.dx; pt.y += pt.dy; pt.dy += 0.2; pt.life--;
                if (pt.life <= 0) particles.splice(i, 1);
            }

            if (!isGameActive) return;

            let nextX = player.x, nextY = player.y;
            let moving = false;

            if (keys.w) { nextY -= player.speed; player.frameY = 3; moving = true; } 
            if (keys.s) { nextY += player.speed; player.frameY = 0; moving = true; } 
            if (!hitWall(player.x, nextY)) player.y = nextY;
            
            if (keys.a) { nextX -= player.speed; player.frameY = 1; moving = true; } 
            if (keys.d) { nextX += player.speed; player.frameY = 2; moving = true; } 
            if (!hitWall(nextX, player.y)) player.x = nextX;

            if (moving) {
                player.animTimer++;
                if (player.animTimer % 8 === 0) player.frameX = (player.frameX + 1) % 4; 
            } else { player.frameX = 0; }

            // Ball Physics
            if (ball.attached) {
                ball.x = player.x + 20;
                ball.y = player.y - 35;
                if (!keys.space) launchLock = false;
                if (keys.space && !launchLock) {
                    ball.attached = false;
                    ball.dx = baseBallSpeed * diffMult;
                    ball.dy = -baseBallSpeed * diffMult;
                    showMessage("ENGAGING...", "#00ffff");
                }
            } else {
                ball.x += ball.dx; ball.y += ball.dy;

                ballTrail.push({ x: ball.x, y: ball.y });
                if (ballTrail.length > 10) ballTrail.shift();

                // Side Walls
                if (ball.x - ball.radius < 40) { ball.x = 40 + ball.radius; ball.dx *= -1; playSound('bounce'); }
                if (ball.x + ball.radius > canvas.width - 40) { ball.x = canvas.width - 40 - ball.radius; ball.dx *= -1; playSound('bounce'); }
                
                // Top Wall & Escape Gap
                if (ball.y - ball.radius < 40) {
                    if (ball.x > 382 && ball.x < 458) {
                        // Silent reset if ball goes completely through the gap
                        if (ball.y + ball.radius < 0) resetBall(true); 
                    } else {
                        ball.y = 40 + ball.radius; ball.dy *= -1; playSound('bounce');
                    }
                }
                
                // Bottom Pit
                if (ball.y + ball.radius > canvas.height) resetBall();

                // Energy Arc Collision
                let arcCenterX = player.x + 20;
                let arcCenterY = player.y + 20;
                let arcRadius = 45;

                if (ball.y + ball.radius > arcCenterY - arcRadius && ball.y - ball.radius < arcCenterY && 
                    ball.x + ball.radius > arcCenterX - arcRadius && ball.x - ball.radius < arcCenterX + arcRadius) {
                    
                    let hitPointX = ball.x - arcCenterX;
                    let currentSpeed = Math.sqrt(ball.dx*ball.dx + ball.dy*ball.dy);

                    let normalizedHit = hitPointX / arcRadius; 
                    if(normalizedHit > 1) normalizedHit = 1;
                    if(normalizedHit < -1) normalizedHit = -1;

                    let angle = normalizedHit * (Math.PI / 2.5); 
                    
                    ball.dx = currentSpeed * Math.sin(angle);
                    ball.dy = -Math.abs(currentSpeed * Math.cos(angle)); // Upward bounce priority
                    
                    ball.y = (arcCenterY - arcRadius) - ball.radius - 1;
                    playSound('bounce');
                }

                // Dynamic Block Collision
                for (let b of blocks) {
                    if (b.health > 0) {
                        let testX = ball.x;
                        let testY = ball.y;
                        
                        if (ball.x < b.x) testX = b.x; else if (ball.x > b.x + b.w) testX = b.x + b.w;
                        if (ball.y < b.y) testY = b.y; else if (ball.y > b.y + b.h) testY = b.y + b.h;
                        
                        let distX = ball.x - testX;
                        let distY = ball.y - testY;
                        let distance = Math.sqrt((distX*distX) + (distY*distY));
                        
                        if (distance <= ball.radius) {
                            b.health--;

                            if (Math.abs(distX) < Math.abs(distY)) ball.dy *= -1;
                            else ball.dx *= -1;

                            score += 10;
                            updateScoreboard();
                            playSound(b.isSpecial ? 'metal' : 'break', b.y);
                            spawnBurst(ball.x, ball.y, b.isSpecial ? "#cccccc" : b.color, b.health <= 0 ? 18 : 7);
                            if (b.health <= 0) shakeTimer = 6;
                            break;
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.save();
            if (shakeTimer > 0) {
                shakeTimer--;
                let mag = Math.min(8, shakeTimer);
                ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
            }

            ctx.fillStyle = "#05060c"; ctx.fillRect(-10, -10, canvas.width + 20, canvas.height + 20);

            // Faint background grid
            ctx.strokeStyle = "rgba(0, 229, 255, 0.05)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let gx = 40; gx < canvas.width - 40; gx += 40) { ctx.moveTo(gx, 40); ctx.lineTo(gx, canvas.height); }
            for (let gy = 40; gy < canvas.height; gy += 40) { ctx.moveTo(40, gy); ctx.lineTo(canvas.width - 40, gy); }
            ctx.stroke();

            // Wall Borders (dark plating with neon inner edge)
            ctx.fillStyle = "#191922";
            ctx.fillRect(0, 0, 40, canvas.height);
            ctx.fillRect(canvas.width - 40, 0, 40, canvas.height);
            ctx.fillRect(0, 0, 382, 40);
            ctx.fillRect(458, 0, canvas.width - 458, 40);
            // Plating seams
            ctx.fillStyle = "rgba(255,255,255,0.05)";
            for (let sy = 0; sy < canvas.height; sy += 80) {
                ctx.fillRect(0, sy, 40, 2);
                ctx.fillRect(canvas.width - 40, sy + 40, 40, 2);
            }
            ctx.fillStyle = "rgba(0, 229, 255, 0.4)";
            ctx.fillRect(38, 40, 2, canvas.height - 40);
            ctx.fillRect(canvas.width - 40, 40, 2, canvas.height - 40);
            ctx.fillRect(40, 38, 342, 2);
            ctx.fillRect(458, 38, canvas.width - 498, 2);

            // Escape Gap: pulsing beacon with rising arrows
            let gapPulse = 0.4 + Math.sin(globalTime * 0.08) * 0.3;
            let gapGrad = ctx.createLinearGradient(0, 0, 0, 40);
            gapGrad.addColorStop(0, `rgba(0, 255, 100, ${(0.25 + gapPulse * 0.3).toFixed(2)})`);
            gapGrad.addColorStop(1, "rgba(0, 255, 100, 0.05)");
            ctx.fillStyle = gapGrad;
            ctx.fillRect(382, 0, 76, 40);
            ctx.strokeStyle = `rgba(0, 255, 100, ${(0.5 + gapPulse * 0.5).toFixed(2)})`;
            ctx.lineWidth = 2;
            let arrowRise = 34 - ((globalTime * 0.6) % 28);
            for (let a = 0; a < 2; a++) {
                let ay = ((arrowRise + a * 14) % 34) + 4;
                ctx.beginPath();
                ctx.moveTo(404, ay + 6); ctx.lineTo(420, ay - 2); ctx.lineTo(436, ay + 6);
                ctx.stroke();
            }
            ctx.save();
            ctx.shadowColor = "#00ff64";
            ctx.shadowBlur = 10;
            ctx.fillStyle = "#00ff64";
            ctx.font = "bold 14px 'Courier New'";
            ctx.textAlign = "center";
            ctx.fillText("EXIT", 420, 25);
            ctx.restore();

            // Draw Dynamic Blocks
            for (let b of blocks) {
                if (b.health > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(b.x, b.y, b.w, b.h);
                    ctx.clip(); // Restrict rendering strictly to block bounds

                    if (b.isSpecial) {
                        // Metallic Block
                        let grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
                        grad.addColorStop(0, "#e0e0e0");
                        grad.addColorStop(0.5, "#999999");
                        grad.addColorStop(1, "#555555");
                        ctx.fillStyle = grad;
                        ctx.fillRect(b.x, b.y, b.w, b.h);
                        
                        ctx.strokeStyle = "rgba(0,0,0,0.6)"; ctx.lineWidth = 2;
                        ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);

                        ctx.fillStyle = "#fff";
                        ctx.beginPath(); ctx.arc(b.x+6, b.y+6, 2, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(b.x+b.w-6, b.y+b.h-6, 2, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(b.x+6, b.y+b.h-6, 2, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(b.x+b.w-6, b.y+6, 2, 0, Math.PI*2); ctx.fill();
                    } else {
                        // Standard Seamless Brick Pattern
                        ctx.fillStyle = b.color;
                        ctx.fillRect(b.x, b.y, b.w, b.h);
                        
                        ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(b.x, b.y + 20); ctx.lineTo(b.x + b.w, b.y + 20); // Center Horizontal
                        
                        // Internal vertical mortar aligned to the global 38px grid
                        for(let gx = b.x; gx < b.x + b.w; gx += 38) {
                            if (gx + 38 < b.x + b.w) {
                                ctx.moveTo(gx + 38, b.y); ctx.lineTo(gx + 38, b.y + 20); // Top Half
                            }
                            ctx.moveTo(gx + 19, b.y + 20); ctx.lineTo(gx + 19, b.y + 40); // Bottom Half Offset
                        }
                        ctx.stroke();
                    }

                    // Solid Outer Edge ensures chunks look defined when gaps appear
                    ctx.strokeStyle = "rgba(0,0,0,0.8)";
                    ctx.lineWidth = 4;
                    ctx.strokeRect(b.x, b.y, b.w, b.h);

                    // Fracturing Overlay
                    if (b.health < b.maxHealth) {
                        ctx.strokeStyle = "rgba(0,0,0,0.8)";
                        ctx.lineWidth = 2;
                        let damage = b.maxHealth - b.health;
                        let cx = b.x + b.w/2, cy = b.y + b.h/2;
                        
                        ctx.beginPath();
                        for(let i=0; i<damage; i++) {
                            let angle = ((b.x * 1.3) + (b.y * 1.7) + (i * 2.1)) % (Math.PI * 2);
                            let crackLen = 15 + ((b.x * i) % 15);
                            ctx.moveTo(cx, cy);
                            ctx.lineTo(cx + Math.cos(angle)*crackLen, cy + Math.sin(angle)*crackLen);
                            
                            let branchAngle = angle + 0.6;
                            let midX = cx + Math.cos(angle)*(crackLen*0.5);
                            let midY = cy + Math.sin(angle)*(crackLen*0.5);
                            ctx.moveTo(midX, midY);
                            ctx.lineTo(midX + Math.cos(branchAngle)*8, midY + Math.sin(branchAngle)*8);
                        }
                        ctx.stroke();
                    }

                    ctx.restore();

                    // UI Health Numbers
                    if (b.isSpecial) {
                        ctx.fillStyle = "#000"; ctx.font = "bold 16px 'Courier New'"; ctx.textAlign = "center";
                        ctx.fillText(b.health, b.x + b.w/2, b.y + b.h/2 + 5);
                    }
                }
            }

            // Draw Player 
            if (playerSprite.complete) {
                ctx.drawImage(playerSprite, player.frameX * 40, player.frameY * 40, 40, 40, player.x, player.y, player.width, player.height);
            } else { 
                ctx.fillStyle = "#7f8c8d"; ctx.fillRect(player.x, player.y, player.width, player.height);
            }

            // Shield (Locked facing UP) — layered energy arc
            ctx.save();
            ctx.lineCap = "round";
            ctx.strokeStyle = "rgba(0, 100, 255, 0.25)"; ctx.lineWidth = 12; ctx.beginPath();
            ctx.arc(player.x+20, player.y+20, 45, (1.5 * Math.PI) - Math.PI/3, (1.5 * Math.PI) + Math.PI/3);
            ctx.stroke();
            ctx.shadowColor = "#00aaff";
            ctx.shadowBlur = 12;
            ctx.strokeStyle = "#33ccff"; ctx.lineWidth = 5; ctx.beginPath();
            ctx.arc(player.x+20, player.y+20, 45, (1.5 * Math.PI) - Math.PI/3, (1.5 * Math.PI) + Math.PI/3);
            ctx.stroke();
            ctx.restore();

            // Particles
            for (let pt of particles) {
                ctx.globalAlpha = Math.min(1, pt.life / 18);
                ctx.fillStyle = pt.color;
                ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
            }
            ctx.globalAlpha = 1.0;

            // Ball trail
            for (let t = 0; t < ballTrail.length; t++) {
                let tp = ballTrail[t];
                let fade = (t + 1) / ballTrail.length;
                ctx.globalAlpha = fade * 0.35;
                ctx.fillStyle = "#00ffff";
                ctx.beginPath();
                ctx.arc(tp.x, tp.y, ball.radius * fade, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // Draw Ball with glow
            ctx.save();
            ctx.shadowColor = "#00ffff";
            ctx.shadowBlur = 15;
            ctx.fillStyle = "#00ffff";
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#ccffff";
            ctx.beginPath();
            ctx.arc(ball.x - 2, ball.y - 2, ball.radius * 0.45, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // --- REWARD OVERLAY ---
            if (!isGameActive) {
                ctx.fillStyle = "rgba(0, 15, 5, 0.92)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = "rgba(0, 255, 0, 0.5)";
                ctx.lineWidth = 2;
                ctx.strokeRect(60, canvas.height / 2 - 150, canvas.width - 120, 300);

                ctx.save();
                ctx.shadowColor = "#00ff00";
                ctx.shadowBlur = 18;
                ctx.fillStyle = "#00ff00"; ctx.font = "bold 40px 'Courier New'"; ctx.textAlign = "center";
                ctx.fillText("SYSTEM BREACHED", canvas.width / 2, canvas.height / 2 - 80);
                ctx.restore();

                ctx.fillStyle = "#aaffaa";
                ctx.font = "bold 20px 'Courier New'";
                ctx.textAlign = "center";
                let lines = REWARD_MESSAGE.split('\n');
                for(let i = 0; i < lines.length; i++) {
                    ctx.fillText(lines[i], canvas.width / 2, canvas.height / 2 - 10 + (i * 30));
                }

                ctx.fillStyle = "#66bb6a";
                ctx.font = "bold 16px 'Courier New'";
                ctx.fillText("[ A / SPACE : RE-RUN SIMULATION ]", canvas.width / 2, canvas.height / 2 + 120);
            }

            ctx.restore();
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
