<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Matrix Protocol: SYSTEM CONSTRUCT</title>
    <style>
        body {
            background-color: #eef0f3; color: #1a2530; font-family: 'Courier New', Courier, monospace;
            margin: 0; padding: 20px; display: flex; flex-direction: column;
            align-items: center; overflow-x: hidden; width: 100%; min-height: 100vh; box-sizing: border-box;
            background-image: radial-gradient(ellipse at 50% 30%, #ffffff, transparent 70%);
        }
        h1 {
            margin: 5px 0 4px 0; font-size: 28px; text-transform: uppercase;
            letter-spacing: 6px; color: #1a2530; text-shadow: 0 1px 0 #fff, 0 0 18px rgba(0, 170, 200, 0.25);
            animation: titleFlicker 4s infinite;
        }
        .subtitle {
            color: #8b95a5; font-size: 12px; letter-spacing: 4px; margin: 0 0 18px 0; text-transform: uppercase;
        }
        @keyframes titleFlicker {
            0%, 100% { opacity: 1; }
            92% { opacity: 1; }
            93% { opacity: 0.55; }
            94% { opacity: 1; }
            96% { opacity: 0.8; }
            97% { opacity: 1; }
        }

        #select-container {
            display: flex; justify-content: center; align-items: center; gap: 20px;
            width: 100%; max-width: 1000px;
        }

        .nav-btn {
            background: #ffffff; color: #1a2530; border: 2px solid #c5ccd6;
            font-family: 'Courier New', Courier, monospace; font-size: 32px; font-weight: bold;
            width: 60px; height: 60px; cursor: pointer; border-radius: 4px;
            transition: all 0.2s; box-shadow: 0 2px 8px rgba(30, 40, 60, 0.12);
        }
        .nav-btn:hover { background: #1a2530; color: #fff; border-color: #1a2530; box-shadow: 0 4px 16px rgba(30, 40, 60, 0.3); }

        .canvas-wrapper {
            position: relative; border: 2px solid #d3d8e0; border-radius: 4px;
            box-shadow: 0 20px 60px rgba(30, 40, 60, 0.18); background: #f4f5f7;
            overflow: hidden;
        }

        canvas#roomCanvas {
            display: block; image-rendering: pixelated;
        }

        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.7));
            border-bottom: 1px solid rgba(30, 40, 60, 0.12);
            padding: 10px; box-sizing: border-box; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            pointer-events: none;
        }

        .char-info { text-align: center; }
        .char-name { font-size: 26px; font-weight: bold; color: #1a2530; margin: 0; letter-spacing: 3px; text-transform: uppercase; transition: color 0.3s, text-shadow 0.3s; }
        .game-title { font-size: 13px; color: #6b7585; margin: 4px 0 0 0; letter-spacing: 2px; }
        .controls-hint { color: #0a8ca8; font-size: 11px; margin-top: 6px; font-weight: bold; letter-spacing: 1px; }

        /* CRT effect — much lighter for the white construct */
        #crt {
            position: fixed; inset: 0; pointer-events: none; z-index: 100;
            background:
                radial-gradient(ellipse at center, transparent 60%, rgba(30, 40, 60, 0.10) 100%),
                repeating-linear-gradient(to bottom, rgba(30, 40, 60, 0.05) 0px, rgba(30, 40, 60, 0.05) 1px, transparent 1px, transparent 3px);
        }
    </style>
</head>
<body>

    <div id="crt"></div>
    <h1>SYSTEM CONSTRUCT</h1>
    <p class="subtitle">// select operative — walk through the uplink door //</p>

    <div id="select-container">
        <button class="nav-btn" id="prevBtn" onclick="changeChar(-1)">&lt;</button>

        <div class="canvas-wrapper">
            <canvas id="roomCanvas" width="800" height="500"></canvas>

            <div id="ui-overlay">
                <div class="char-info">
                    <h2 class="char-name" id="ui-name">Andromeda</h2>
                    <p class="game-title" id="ui-game">TARGET: STEALTH INFILTRATION</p>
                    <p class="controls-hint">[ WASD / STICK: MOVE &nbsp;|&nbsp; Q / E / LB / RB: CYCLE &nbsp;|&nbsp; ENTER / A: JACK IN &nbsp;|&nbsp; DOOR: UPLINK ]</p>
                </div>
            </div>
        </div>

        <button class="nav-btn" id="nextBtn" onclick="changeChar(1)">&gt;</button>
    </div>

    <script>
        const canvas = document.getElementById("roomCanvas");
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = false;

        // --- CHARACTER DATA & ASSET LOADING ---
        const characters = [
            { id: "andromeda", name: "Andromeda", game: "TARGET: STEALTH INFILTRATION", file: "Andromeda.html", imgFile: "Andromeda.png", accent: "#a03cc4", img: new Image(), available: true, spriteScale: 1 },
            { id: "uriel",     name: "Uriel",     game: "TARGET: THE LINEUP",           file: "Uriel.html",     imgFile: "Uriel.png",     accent: "#e88600", img: new Image(), available: true, spriteScale: 1 },
            { id: "wyrd",      name: "Wyrd",      game: "TARGET: WORLD OF WYRDCRAFT",   file: "Wyrd.html",      imgFile: "Wyrd.png",      accent: "#78909c", img: new Image(), available: false, spriteScale: 1 },
            { id: "morrigan",  name: "Morrigan",  game: "TARGET: NIGHT RUN",            file: "Morrigan.html",  imgFile: "Morrigan.png",  accent: "#e91e63", img: new Image(), available: true, spriteScale: 1 },
            { id: "shield",    name: "Shield Process", game: "TARGET: BREAKOUT",        file: "Shield.html",    imgFile: "Shield.png",    accent: "#00acc1", img: new Image(), available: true, spriteScale: 1.55 },
            { id: "trinker",   name: "Trinker",   game: "TARGET: ZIPPY RACE",           file: "Trinker.html",   imgFile: "Trinker.png",   accent: "#d4a900", img: new Image(), available: true, spriteScale: 1 },
            { id: "uji",       name: "Uji",       game: "TARGET: FROGGER",              file: "Uji.html",       imgFile: "Uji.png",       accent: "#1faf5c", img: new Image(), available: true, spriteScale: 1 }
        ];

        characters.forEach(c => c.img.src = c.imgFile);
        let currentIndex = 0;
        let time = 0;
        let offlineFlash = 0;

        // --- 3D ROOM CONSTANTS ---
        const BW_W = 400;
        const BW_H = 200;
        const BW_X = (canvas.width - BW_W) / 2;
        const BW_Y = 100;
        const FLOOR_TOP = BW_Y + BW_H;
        const FLOOR_BOTTOM = canvas.height;
        const FLOOR_DEPTH = FLOOR_BOTTOM - FLOOR_TOP;

        // --- DATA MOTES (ambient particles) ---
        const motes = [];
        for (let i = 0; i < 20; i++) {
            motes.push({
                x: Math.random() * canvas.width,
                y: BW_Y + Math.random() * (canvas.height - BW_Y),
                s: 0.3 + Math.random() * 0.5,
                drift: 0.1 + Math.random() * 0.3,
                phase: Math.random() * Math.PI * 2
            });
        }

        // --- ACTOR LOGIC ---
        let actor = {
            x: 0, z: 0.5,
            frameX: 0, frameY: 0, animTick: 0
        };

        // --- INPUT HANDLING ---
        const keys = { w: false, a: false, s: false, d: false, arrowup: false, arrowdown: false, arrowleft: false, arrowright: false };
        window.addEventListener("keydown", e => {
            const k = e.key.toLowerCase();
            if (keys.hasOwnProperty(k)) keys[k] = true;
            if (k === 'q') changeChar(-1);
            if (k === 'e') changeChar(1);
            if (k === 'enter') launchGame();
        });
        window.addEventListener("keyup", e => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

        let gpButtonState = { lb: false, rb: false, a: false };

        function hexToRgb(hex) {
            return {
                r: parseInt(hex.substring(1,3), 16),
                g: parseInt(hex.substring(3,5), 16),
                b: parseInt(hex.substring(5,7), 16)
            };
        }

        function changeChar(dir) {
            currentIndex += dir;
            if (currentIndex < 0) currentIndex = characters.length - 1;
            if (currentIndex >= characters.length) currentIndex = 0;

            const c = characters[currentIndex];
            const nameEl = document.getElementById("ui-name");
            const gameEl = document.getElementById("ui-game");
            nameEl.innerText = c.name;
            nameEl.style.color = c.accent;
            nameEl.style.textShadow = `0 1px 0 #fff`;
            gameEl.innerText = c.available ? c.game : c.game + "  [ SIGNAL LOST ]";
            gameEl.style.color = c.available ? "#6b7585" : "#d32f2f";

            actor.x = 0; actor.z = 0.5; actor.frameY = 0;
        }

        function launchGame() {
            const c = characters[currentIndex];
            if (!c.available) {
                offlineFlash = 60;
                return;
            }
            window.location.href = c.file;
        }

        function update() {
            time++;
            if (offlineFlash > 0) offlineFlash--;

            let dx = 0;
            let dz = 0;
            const speed = 0.015;

            if (keys.w || keys.arrowup) dz -= speed;
            if (keys.s || keys.arrowdown) dz += speed;
            if (keys.a || keys.arrowleft) dx -= speed;
            if (keys.d || keys.arrowright) dx += speed;

            // Gamepad Poll
            const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            const gp = gamepads[0];
            if (gp) {
                if (Math.abs(gp.axes[0]) > 0.2) dx += gp.axes[0] * speed;
                if (Math.abs(gp.axes[1]) > 0.2) dz += gp.axes[1] * speed;
                if (gp.buttons[14]?.pressed) dx -= speed;
                if (gp.buttons[15]?.pressed) dx += speed;
                if (gp.buttons[12]?.pressed) dz -= speed;
                if (gp.buttons[13]?.pressed) dz += speed;

                const lb = gp.buttons[4]?.pressed, rb = gp.buttons[5]?.pressed;
                const aBtn = gp.buttons[0]?.pressed || gp.buttons[9]?.pressed;
                if (lb && !gpButtonState.lb) changeChar(-1);
                if (rb && !gpButtonState.rb) changeChar(1);
                if (aBtn && !gpButtonState.a) launchGame();
                gpButtonState = { lb, rb, a: aBtn };
            }

            if (dx !== 0 || dz !== 0) {
                actor.x += dx;
                actor.z += dz;

                actor.x = Math.max(-1, Math.min(1, actor.x));
                actor.z = Math.max(0, Math.min(1, actor.z));

                if (Math.abs(dx) > Math.abs(dz)) {
                    actor.frameY = dx > 0 ? 2 : 1;
                } else {
                    actor.frameY = dz > 0 ? 0 : 3;
                }

                actor.animTick++;
                if (actor.animTick % 8 === 0) actor.frameX = (actor.frameX + 1) % 4;
            } else {
                actor.frameX = 0;
            }

            // --- DOOR TRIGGER ---
            if (actor.x >= 0.95 && actor.z >= 0.3 && actor.z <= 0.7) {
                if (characters[currentIndex].available) {
                    actor.x = 0;
                    actor.z = 0.5;
                    launchGame();
                } else {
                    actor.x = 0.7;
                    offlineFlash = 60;
                }
            }
        }

        // Perspective helpers
        function floorPoint(nx, z) {
            // nx in [-1, 1] left-right, z in [0,1] back-front
            const w = BW_W + ((canvas.width - BW_W) * z);
            const left = (canvas.width - w) / 2;
            return {
                x: left + ((nx + 1) / 2) * w,
                y: FLOOR_TOP + z * FLOOR_DEPTH
            };
        }

        function drawRoom() {
            const c = characters[currentIndex];
            const acc = hexToRgb(c.accent);
            const accStr = (a) => `rgba(${acc.r},${acc.g},${acc.b},${a})`;

            // The white construct: bright, near-infinite
            ctx.fillStyle = "#f7f8fa";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            const ceil = ctx.createLinearGradient(0, 0, 0, BW_Y);
            ceil.addColorStop(0, "#ffffff");
            ceil.addColorStop(1, "#f2f3f6");
            ctx.fillStyle = ceil;
            ctx.fillRect(0, 0, canvas.width, FLOOR_TOP);

            // Back wall
            const wallGrad = ctx.createLinearGradient(0, BW_Y, 0, FLOOR_TOP);
            wallGrad.addColorStop(0, "#fdfdfe");
            wallGrad.addColorStop(1, "#f2f4f7");
            ctx.fillStyle = wallGrad;
            ctx.fillRect(BW_X, BW_Y, BW_W, BW_H);

            // Back wall grid — barely-there construct wireframe
            ctx.strokeStyle = "rgba(30, 40, 60, 0.05)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let gx = 0; gx <= 10; gx++) {
                const x = BW_X + (BW_W / 10) * gx;
                ctx.moveTo(x, BW_Y); ctx.lineTo(x, FLOOR_TOP);
            }
            for (let gy = 0; gy <= 5; gy++) {
                const y = BW_Y + (BW_H / 5) * gy;
                ctx.moveTo(BW_X, y); ctx.lineTo(BW_X + BW_W, y);
            }
            ctx.stroke();

            // --- HOLOGRAM PROJECTION on back wall ---
            const holoImg = c.img;
            const holoSize = 120 * (c.spriteScale || 1);
            const holoX = BW_X + BW_W / 2 - holoSize / 2;
            const holoY = BW_Y + BW_H / 2 - holoSize / 2 - 10 + Math.sin(time * 0.03) * 4;
            const holoFrame = Math.floor(time / 16) % 4;
            ctx.save();
            ctx.globalAlpha = 0.4 + Math.sin(time * 0.11) * 0.06;
            if (Math.floor(time / 3) % 29 === 0) ctx.globalAlpha *= 0.4; // glitch flicker
            if (holoImg.complete && holoImg.naturalWidth > 0) {
                ctx.shadowColor = c.accent;
                ctx.shadowBlur = 25;
                ctx.drawImage(holoImg, holoFrame * 40, 0, 40, 40, holoX, holoY, holoSize, holoSize);
            } else {
                // Glitch silhouette for missing constructs
                ctx.fillStyle = "rgba(120, 130, 150, 0.5)";
                for (let i = 0; i < 8; i++) {
                    const gy2 = holoY + i * (holoSize / 8);
                    const jitter = (Math.sin(time * 0.3 + i * 7) * 8);
                    ctx.fillRect(holoX + 20 + jitter, gy2, holoSize - 40, holoSize / 10);
                }
                ctx.font = "bold 14px 'Courier New'";
                ctx.textAlign = "center";
                ctx.fillStyle = "#d32f2f";
                ctx.fillText("NO SIGNAL", holoX + holoSize / 2, holoY + holoSize + 14);
            }
            ctx.restore();

            // Hologram scan bar
            ctx.fillStyle = accStr(0.06);
            const scanY = BW_Y + ((time * 0.8) % BW_H);
            ctx.fillRect(BW_X, scanY, BW_W, 3);

            // Corner edges — soft, like the room fades into itself
            ctx.strokeStyle = "rgba(30, 40, 60, 0.12)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 0); ctx.lineTo(BW_X, BW_Y);
            ctx.moveTo(canvas.width, 0); ctx.lineTo(BW_X + BW_W, BW_Y);
            ctx.moveTo(0, canvas.height); ctx.lineTo(BW_X, FLOOR_TOP);
            ctx.moveTo(canvas.width, canvas.height); ctx.lineTo(BW_X + BW_W, FLOOR_TOP);
            ctx.strokeRect(BW_X, BW_Y, BW_W, BW_H);
            ctx.stroke();

            // Floor
            const floorGrad = ctx.createLinearGradient(0, FLOOR_TOP, 0, canvas.height);
            floorGrad.addColorStop(0, "#f0f2f5");
            floorGrad.addColorStop(1, "#e3e6ec");
            ctx.fillStyle = floorGrad;
            ctx.beginPath();
            ctx.moveTo(BW_X, FLOOR_TOP);
            ctx.lineTo(BW_X + BW_W, FLOOR_TOP);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.closePath();
            ctx.fill();

            // Floor grid: depth lines
            ctx.strokeStyle = "rgba(30, 40, 60, 0.08)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let i = 1; i <= 6; i++) {
                const depthZ = Math.pow(i / 6, 1.4);
                const p1 = floorPoint(-1, depthZ);
                const p2 = floorPoint(1, depthZ);
                ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
            }
            // Converging lines
            for (let j = 0; j <= 8; j++) {
                const nx = -1 + (j / 4);
                const pBack = floorPoint(nx, 0);
                const pFront = floorPoint(nx, 1);
                ctx.moveTo(pBack.x, pBack.y); ctx.lineTo(pFront.x, pFront.y);
            }
            ctx.stroke();

            // --- DATA MOTES ---
            for (const m of motes) {
                const my = m.y + Math.sin(time * 0.02 + m.phase) * 6;
                const mx = m.x + Math.sin(time * 0.008 + m.phase * 2) * 10;
                ctx.fillStyle = accStr(0.18 + Math.sin(time * 0.05 + m.phase) * 0.1);
                ctx.fillRect(mx, my, 2, 2);
            }

            // --- RIGHT-WALL UPLINK DOOR ---
            const zStart = 0.3, zEnd = 0.7;
            const pS = floorPoint(1, zStart);
            const pE = floorPoint(1, zEnd);
            const doorHeightStart = 100 * (1 + zStart * 1.5);
            const doorHeightEnd = 100 * (1 + zEnd * 1.5);

            const doorAvailable = c.available;
            const doorColor = doorAvailable ? c.accent : "#d32f2f";
            const dc = hexToRgb(doorColor);
            const dcStr = (a) => `rgba(${dc.r},${dc.g},${dc.b},${a})`;
            const pulse = doorAvailable ? (0.5 + Math.sin(time * 0.06) * 0.25) : (offlineFlash > 0 ? 0.9 : 0.25);

            // Light pool on floor in front of the door
            const poolGrad = ctx.createRadialGradient((pS.x + pE.x) / 2 - 40, (pS.y + pE.y) / 2, 5, (pS.x + pE.x) / 2 - 40, (pS.y + pE.y) / 2, 120);
            poolGrad.addColorStop(0, dcStr(0.10 * pulse * 2));
            poolGrad.addColorStop(1, "rgba(255,255,255,0)");
            ctx.fillStyle = poolGrad;
            ctx.fillRect(0, FLOOR_TOP, canvas.width, FLOOR_DEPTH);

            ctx.fillStyle = dcStr(0.10 + pulse * 0.08);
            ctx.strokeStyle = doorColor;
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.moveTo(pS.x, pS.y);
            ctx.lineTo(pE.x, pE.y);
            ctx.lineTo(pE.x, pE.y - doorHeightEnd);
            ctx.lineTo(pS.x, pS.y - doorHeightStart);
            ctx.closePath();

            ctx.shadowColor = doorColor;
            ctx.shadowBlur = 10 + pulse * 15;
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0;

            // Energy lines inside the door
            ctx.strokeStyle = dcStr(0.3 + pulse * 0.3);
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let li = 1; li <= 4; li++) {
                const t = li / 5;
                const ly1 = (pS.y - doorHeightStart * t);
                const ly2 = (pE.y - doorHeightEnd * t);
                const wob = Math.sin(time * 0.1 + li * 2) * 3;
                ctx.moveTo(pS.x, ly1 + wob); ctx.lineTo(pE.x, ly2 + wob);
            }
            ctx.stroke();

            // Floor chevrons pointing at the door (only when available)
            if (doorAvailable) {
                for (let ch = 0; ch < 3; ch++) {
                    const chevAlpha = 0.15 + 0.4 * Math.max(0, Math.sin(time * 0.08 - ch * 0.9));
                    const nx = 0.35 + ch * 0.2;
                    const pC = floorPoint(nx, 0.5);
                    const sc = 1 + 0.5 * ((nx + 1) / 2);
                    ctx.strokeStyle = accStr(chevAlpha);
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(pC.x - 8 * sc, pC.y - 8 * sc);
                    ctx.lineTo(pC.x + 4 * sc, pC.y);
                    ctx.lineTo(pC.x - 8 * sc, pC.y + 8 * sc);
                    ctx.stroke();
                }
            } else if (offlineFlash > 0 && Math.floor(offlineFlash / 6) % 2 === 0) {
                ctx.fillStyle = "#d32f2f";
                ctx.font = "bold 22px 'Courier New'";
                ctx.textAlign = "center";
                ctx.shadowColor = "#d32f2f";
                ctx.shadowBlur = 12;
                ctx.fillText("CONSTRUCT OFFLINE", canvas.width / 2, FLOOR_TOP + 60);
                ctx.shadowBlur = 0;
            }
        }

        function drawCharacter() {
            const c = characters[currentIndex];
            const currentImg = c.img;
            let scale = (1.0 + (actor.z * 2.0)) * (c.spriteScale || 1);

            const p = floorPoint(actor.x, actor.z);
            const screenX = p.x;
            const screenY = p.y;

            const spriteSize = 40;
            const drawSize = spriteSize * scale;
            let drawX = screenX - (drawSize / 2);
            let drawY = screenY - drawSize;

            ctx.fillStyle = "rgba(30, 40, 60, 0.22)";
            ctx.beginPath();
            ctx.ellipse(screenX, screenY - (4 * scale), 12 * scale, 4 * scale, 0, 0, Math.PI * 2);
            ctx.fill();

            if (currentImg.complete && currentImg.naturalWidth > 0) {
                ctx.drawImage(
                    currentImg,
                    actor.frameX * spriteSize, actor.frameY * spriteSize, spriteSize, spriteSize,
                    drawX, drawY, drawSize, drawSize
                );
            } else {
                // Glitch placeholder silhouette
                ctx.save();
                ctx.globalAlpha = 0.85;
                ctx.fillStyle = "#aab2c0";
                for (let i = 0; i < 8; i++) {
                    const gy = drawY + i * (drawSize / 8);
                    const jitter = Math.sin(time * 0.4 + i * 5) * (3 * scale);
                    ctx.fillRect(drawX + 6 * scale + jitter, gy, drawSize - 12 * scale, drawSize / 9);
                }
                ctx.fillStyle = "#d32f2f";
                ctx.font = `bold ${Math.floor(8 * scale)}px 'Courier New'`;
                ctx.textAlign = "center";
                ctx.fillText("?", screenX, drawY + drawSize / 2);
                ctx.restore();
            }
        }

        function loop() {
            update();
            drawRoom();
            drawCharacter();
            requestAnimationFrame(loop);
        }

        changeChar(0);
        loop();
    </script>
</body>
</html>
